[platformio]
default_envs = esp32-01

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.4
build_flags =
  -D MQTT_PORT=1883
  -D FIRMWARE_VERSION=\"0.1.0\"

[env:esp32-01]
build_flags =
  ${env.build_flags}
  -D AGENT_ID=\"empathy\"
  -D DEVICE_ID=\"esp32-01\"

[env:esp32-02]
build_flags =
  ${env.build_flags}
  -D AGENT_ID=\"critical\"
  -D DEVICE_ID=\"esp32-02\"

[env:esp32-03]
build_flags =
  ${env.build_flags}
  -D AGENT_ID=\"optimistic\"
  -D DEVICE_ID=\"esp32-03\"

[env:esp32-04]
build_flags =
  ${env.build_flags}
  -D AGENT_ID=\"moderator\"
  -D DEVICE_ID=\"esp32-04\"

