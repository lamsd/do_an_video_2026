[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esp32-ai-meeting-emotion-lab"
version = "0.1.0"
description = "Distributed four-device MQTT simulator for autonomous AI meeting agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "alembic>=1.13,<2",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "paho-mqtt>=2.1,<3",
  "openai>=1.50,<3",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "librosa>=0.10,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7", "mypy>=1.12"]
emotion = ["torch>=2.3,<3"]

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "simulator"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["backend/app", "simulator"]
ignore_missing_imports = true

