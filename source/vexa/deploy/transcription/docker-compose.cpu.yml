# =============================================================================
# Transcription service — CPU-only variant (no GPU). For dev/testing.
# =============================================================================
#   docker compose -f docker-compose.cpu.yml up -d
# Slower + lower accuracy than GPU; use a smaller MODEL_SIZE (e.g. base/small/medium).
services:
  transcription-api:
    image: nginx:alpine
    ports:
      - "${TRANSCRIPTION_LB_PORT:-8083}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - transcription-worker-1
    restart: unless-stopped
    networks: [transcription-net]

  transcription-worker-1:
    build:
      context: ../..
      dockerfile: core/meetings/services/transcription/Dockerfile.cpu
    image: vexaai/v012-transcription-cpu:${IMAGE_TAG:-dev}
    environment:
      - WORKER_ID=1
      # Default `small`, not `medium`: on a CPU worker `medium` cannot keep up with real-time meeting
      # audio and sheds load with 503 "Service busy" (a fresh self-host on a modest VM gets NO
      # transcript). `small` keeps pace on ~4-6 vCPU (witnessed). Raise to medium/large only with GPU.
      - MODEL_SIZE=${MODEL_SIZE:-small}
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - CPU_THREADS=${CPU_THREADS:-0}
      # Conservative speech boundaries reduce fragmented noise windows on
      # Jitsi's raw WebRTC capture. These can be overridden in .env.
      - MAX_ACTIVE_REQUESTS=${MAX_ACTIVE_REQUESTS:-2}
      - VAD_FILTER=${VAD_FILTER:-true}
      - VAD_FILTER_THRESHOLD=${VAD_FILTER_THRESHOLD:-0.65}
      - VAD_MIN_SILENCE_DURATION_MS=${VAD_MIN_SILENCE_DURATION_MS:-400}
      - VAD_MAX_SPEECH_DURATION_S=${VAD_MAX_SPEECH_DURATION_S:-20}
      - MIN_AUDIO_DURATION_S=${MIN_AUDIO_DURATION_S:-1.0}
      - MIN_TRANSCRIPT_DURATION_S=${MIN_TRANSCRIPT_DURATION_S:-1.0}
      - MIN_TRANSCRIPT_WORDS=${MIN_TRANSCRIPT_WORDS:-3}
      - USE_REQUEST_PROMPT=${USE_REQUEST_PROMPT:-false}
      - MIN_AUTO_LANGUAGE_PROBABILITY=${MIN_AUTO_LANGUAGE_PROBABILITY:-0.45}
      - API_TOKEN=${API_TOKEN:-}
    volumes:
      - transcription-models:/app/models
    restart: unless-stopped
    networks: [transcription-net]

networks:
  transcription-net:
    driver: bridge

volumes:
  transcription-models:
