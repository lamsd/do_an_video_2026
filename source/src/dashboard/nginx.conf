server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Docker can assign a new backend IP whenever backend is recreated after a
  # settings change. A literal proxy_pass hostname is resolved only when Nginx
  # starts, leaving the dashboard pointed at a stale container IP and returning
  # 502 although /ready on the new backend is healthy. Resolve through Docker
  # DNS at request time instead.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $backend_upstream http://backend:8088;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Cache-Control "no-store" always;

  location /api/ {
    # Keep the public /api/ prefix out of the backend route while preserving
    # the remaining path and query string.  With a variable upstream, a
    # trailing slash in proxy_pass would send every request to just "/".
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

